       ❄️ WINTER COLLECTION DESIGN SYSTEM (CSS)

    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --dark: #0f172a;
      --slate: #334155;
      --slate-light: #64748b;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --border-color: #e2e8f0;

      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-full: 9999px;
      --font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-gradient);
      color: var(--dark);
      min-height: 100vh;
      line-height: 1.5;
    }

    .app-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 🧭 NAVBAR */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      padding: 0.85rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      font-size: 2rem;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -0.02em;
    }

    .brand-subtitle {

    }

    /* 🔎 SEARCH BAR */

    .search-icon {

      color: var(--slate-light);

      background-color: #f8fafc;
      font-size: 0.925rem;
      font-family: inherit;
      color: var(--dark);

    .search-input:focus {

    .clear-search-btn {

      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;

    /* 🛒 CART BUTTON */
    .cart-nav-btn {

      align-items: center;
      gap: 0.6rem;
      background: var(--dark);
      color: #ffffff;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-full);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;

    .products-grid {

    .product-card {

    .product-card:hover {

    .rating-box {

      font-size: 0.8rem;
      font-weight: 700;
      color: #d97706;
      margin-bottom: 0.4rem;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 0.45rem;
    }

    .product-desc {
      font-size: 0.825rem;
      color: var(--slate-light);
      margin-bottom: 1.25rem;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.75rem;
      border-top: 1px solid #f1f5f9;
    }

    .price-tag .currency {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--slate);
    }

    .price-tag .amount {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--dark);
    }

    .add-to-cart-btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-to-cart-btn:hover {
      background: var(--primary-hover);
    }

    /* 🛍️ CART MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: flex-end;
      z-index: 100;
    }

    .cart-modal {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .close-modal-btn {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.5rem;
    }

    .cart-item-row {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 1rem;
    }

    .cart-item-img {
      width: 60px;
      height: 70px;
      object-fit: cover;
      border-radius: var(--radius-md);
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-info h4 {
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
    }

    .qty-btn {
      background: #f8fafc;
      border: none;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-weight: bold;
    }

    .qty-number {
      padding: 0 0.5rem;
      font-size: 0.85rem;
    }

    .modal-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border-color);
      background: #f8fafc;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .checkout-btn {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.85rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }

    @media (max-width: 768px) {
      .navbar {
        flex-wrap: wrap;
        padding: 0.75rem 1rem;
      }

      .search-container {
        order: 3;
        width: 100%;
      }

      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- React Code with Babel JSX -->

    function WinterApp() {
      // 📌 State Variables
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);

      const filteredProducts = productsData.filter((item) => {
        const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;
        const searchLower = searchTerm.toLowerCase().trim();
        const matchesSearch =
          item.name.toLowerCase().includes(searchLower) ||
          item.category.toLowerCase().includes(searchLower) ||
          item.description.toLowerCase().includes(searchLower);

        return matchesCategory && matchesSearch;
      });

      // 🛒 Add to Cart
      const handleAddToCart = (product) => {
        setCart((prev) => {
          const exists = prev.find((item) => item.id === product.id);
          if (exists) {
            return prev.map((item) => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { ...product, quantity: 1 }];
        });
      };

      const handleUpdateQty = (id, delta) => {
        setCart((prev) => prev.map((item) => {
          if (item.id === id) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const handleRemove = (id) => setCart((prev) => prev.filter((item) => item.id !== id));
      const totalCount = cart.reduce((acc, item) => acc + item.quantity, 0);
      const totalPrice = cart.reduce((acc, item) => acc + item.price * item.quantity, 0);

          <main className="main-content">
            <div className="results-info">
              Showing <strong>{filteredProducts.length}</strong> items
              {searchTerm && <span> for search "<em>{searchTerm}</em>"</span>}
            </div>

            <div className="products-grid">
              {filteredProducts.map((item) => (
                <div key={item.id} className="product-card">
                  <div className="card-image-box">
                    <img src={item.image} alt={item.name} className="product-img" />
                    <span className={`category-tag ${item.category}`}>
                      {item.category === 'men' ? '🧔 Men' : '👩 Women'}
                    </span>
                  </div>
                  <div className="card-body">
                    <div className="rating-box">⭐ {item.rating} (Verified)</div>
                    <h3 className="product-title">{item.name}</h3>
                    <p className="product-desc">{item.description}</p>
                    <div className="card-footer">
                      <div className="price-tag">
                        <span className="currency">Rs.</span>
                        <span className="amount">{item.price.toLocaleString()}</span>
                      </div>
                      <button className="add-to-cart-btn" onClick={() => handleAddToCart(item)}>
                        + Add to Cart
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* 🛍️ CART MODAL */}
          {isCartOpen && (
            <div className="modal-overlay" onClick={() => setIsCartOpen(false)}>
              <div className="cart-modal" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h3>🛒 Your Shopping Cart ({totalCount})</h3>
                  <button className="close-modal-btn" onClick={() => setIsCartOpen(false)}>✕</button>
                </div>
                <div className="modal-body">
                  {cart.length === 0 ? (
                    <div style={{ textAlign: 'center', padding: '3rem 1rem' }}>
                      <p>Your cart is empty.</p>
                    </div>
                  ) : (
                    cart.map((cartItem) => (
                      <div key={cartItem.id} className="cart-item-row">
                        <img src={cartItem.image} alt={cartItem.name} className="cart-item-img" />
                        <div className="cart-item-info">
                          <h4>{cartItem.name}</h4>
                          <p style={{ fontSize: '0.8rem', color: '#64748b' }}>
                            Rs. {cartItem.price.toLocaleString()}
                          </p>
                        </div>
                        <div className="quantity-controls">
                          <button className="qty-btn" onClick={() => handleUpdateQty(cartItem.id, -1)}>-</button>
                          <span className="qty-number">{cartItem.quantity}</span>
                          <button className="qty-btn" onClick={() => handleUpdateQty(cartItem.id, 1)}>+</button>
                        </div>
                        <button
                          style={{ background: 'none', border: 'none', cursor: 'pointer', marginLeft: '0.5rem' }}
                          onClick={() => handleRemove(cartItem.id)}
                        >
                          🗑️
                        </button>
                      </div>
                    ))
                  )}
                </div>
                {cart.length > 0 && (
                  <div className="modal-footer">
                    <div className="total-row">
                      <span>Total:</span>
                      <span>Rs. {totalPrice.toLocaleString()}</span>
                    </div>
                    <button
                      className="checkout-btn"
                      onClick={() => {
                        alert(`Thank you! Your order of Rs. ${totalPrice.toLocaleString()} has been placed successfully!`);
                        setCart([]);
                        setIsCartOpen(false);
                      }}
                    >
                      Confirm Order
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<WinterApp />);
  </script>
</body>

</html>
